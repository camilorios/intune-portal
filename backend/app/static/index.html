<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portal Intune</title>
<style>
  :root{--b:#0f6cbd;--bg:#f5f7fa;--card:#fff;--muted:#5b6470;--err:#c50f1f;--ok:#107c10}
  *{box-sizing:border-box}body{margin:0;font-family:Segoe UI,system-ui,sans-serif;background:var(--bg);color:#1b1f24}
  header{background:var(--b);color:#fff;padding:14px 24px;display:flex;justify-content:space-between;align-items:center}
  header h1{font-size:18px;margin:0}header a{color:#fff}
  main{max-width:1100px;margin:24px auto;padding:0 16px;display:grid;grid-template-columns:300px 1fr;gap:16px}
  .card{background:var(--card);border-radius:10px;padding:16px;box-shadow:0 1px 3px #0001}
  h2{font-size:15px;margin:0 0 12px}button{background:var(--b);color:#fff;border:0;border-radius:6px;padding:8px 14px;cursor:pointer;font-size:14px}
  button.sec{background:#e8eef6;color:var(--b)}button.danger{background:var(--err)}button:disabled{opacity:.5;cursor:default}
  .tenant{padding:8px;border-radius:6px;cursor:pointer;font-size:13px;word-break:break-all}.tenant.sel,.tenant:hover{background:#e8eef6}
  select,input{width:100%;padding:8px;border:1px solid #ccd3dc;border-radius:6px;font-size:14px;margin:6px 0}
  table{width:100%;border-collapse:collapse;font-size:13px}td,th{text-align:left;padding:6px;border-bottom:1px solid #eef1f5}
  .muted{color:var(--muted);font-size:13px}.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
  #log{white-space:pre-wrap;font-family:Consolas,monospace;font-size:12px;background:#0b1220;color:#d6e2ff;border-radius:8px;padding:12px;max-height:260px;overflow:auto}
  .ok{color:var(--ok)}.bad{color:var(--err)}
</style>
</head>
<body>
<header><h1>Portal de despliegue Intune</h1><div><span id="user" class="muted" style="color:#dfe9f7"></span> · <a href="/.auth/logout">Salir</a></div></header>
<main>
  <section class="card">
    <h2>Clientes</h2>
    <div id="tenants" class="muted">Cargando…</div>
    <div class="row"><button class="sec" onclick="copyConsent()">Copiar enlace de alta</button></div>
    <p class="muted">Envía el enlace al administrador global del cliente. Al aceptar, aparece aquí.</p>
  </section>
  <section>
    <div class="card" id="panel"><p class="muted">Elige un cliente.</p></div>
    <div class="card" style="margin-top:16px"><h2>Actividad</h2><div id="log">—</div></div>
  </section>
</main>
<script>
let tenant=null, baselines=[];
const $=id=>document.getElementById(id);
const log=m=>{$('log').textContent=`[${new Date().toLocaleTimeString()}] ${m}\n`+($('log').textContent==='—'?'':$('log').textContent)};
async function api(path,opt={}){const r=await fetch(path,{headers:{'Content-Type':'application/json'},...opt});
  const t=await r.text();let d;try{d=JSON.parse(t)}catch{d=t}
  if(!r.ok)throw new Error(d.detail||t);return d}
async function init(){
  api('/me').then(d=>$('user').textContent=d.user).catch(()=>{});
  baselines=await api('/baselines');loadTenants()}
async function loadTenants(){
  const t=await api('/tenants');const ids=Object.keys(t);
  $('tenants').innerHTML=ids.length?ids.map(id=>`<div class="tenant ${id===tenant?'sel':''}" onclick="pick('${id}')"><b>${t[id].name}</b><br><span class="muted">alta ${t[id].onboarded.slice(0,10)}</span></div>`).join(''):'Aún no hay clientes.'}
async function copyConsent(){const d=await api('/onboarding/consent-url');await navigator.clipboard.writeText(d.url);log('Enlace de alta copiado al portapapeles.')}
async function pick(id){tenant=id;loadTenants();
  $('panel').innerHTML=`<h2>Cliente ${id}</h2>
  <div class="row"><button class="sec" onclick="backup()">Hacer backup</button></div>
  <h2 style="margin-top:16px">Desplegar baseline</h2>
  <select id="bl">${baselines.map(b=>`<option>${b.name}</option>`).join('')}</select>
  <div class="row"><button class="sec" onclick="preview()">Vista previa</button></div>
  <div id="prev"></div>
  <h2 style="margin-top:16px">Despliegues</h2><div id="deps" class="muted">Cargando…</div>`;
  loadDeps()}
async function loadDeps(){const d=await api(`/tenants/${tenant}/deployments`);
  $('deps').innerHTML=d.length?`<table><tr><th>Fecha</th><th>Baseline</th><th>Creados</th><th>Errores</th><th></th></tr>${d.map(x=>`<tr><td>${(x.at||'').slice(0,16).replace('T',' ')}</td><td>${x.baseline}</td><td>${x.created}</td><td class="${x.errors?'bad':''}">${x.errors}</td><td><button class="danger" onclick="rollback('${x.id}')">Revertir</button></td></tr>`).join('')}</table>`:'Sin despliegues.'}
async function backup(){log('Haciendo backup…');try{const d=await api(`/tenants/${tenant}/backup`,{method:'POST'});log('Backup listo: '+d.backup_id)}catch(e){log('Error: '+e.message)}}
async function preview(){const b=$('bl').value;log('Calculando vista previa de '+b+'…');
  try{const p=await api(`/tenants/${tenant}/preview/${b}`);
  $('prev').innerHTML=`<table><tr><th>Tipo</th><th>Objeto</th><th>Acción</th></tr>${p.map(x=>`<tr><td>${x.resource}</td><td>${x.name}</td><td class="${x.action==='create'?'ok':'muted'}">${x.action}</td></tr>`).join('')}</table>
  <p class="muted">Para aplicar, escribe el ID del tenant:</p><input id="conf" placeholder="${tenant}"><div class="row"><button onclick="deploy()">Desplegar</button></div>`;log('Vista previa lista.')}catch(e){log('Error: '+e.message)}}
async function deploy(){const b=$('bl').value;if($('conf').value.trim()!==tenant)return log('La confirmación no coincide con el tenant.');
  log('Desplegando '+b+' (con snapshot previo)…');
  try{const d=await api(`/tenants/${tenant}/deploy`,{method:'POST',body:JSON.stringify({baseline:b,confirm_tenant:tenant})});
  log(`Despliegue ${d.deployment_id}: ${d.created.length} creados, ${d.errors.length} errores.`+d.errors.map(e=>`\n  ✗ ${e.name}: ${e.error.slice(0,200)}`).join(''));loadDeps()}catch(e){log('Error: '+e.message)}}
async function rollback(id){const c=prompt('Esto eliminará lo creado por el despliegue '+id+'. Escribe el ID del tenant para confirmar:');
  if(c!==tenant)return log('Reversión cancelada.');log('Revirtiendo '+id+'…');
  try{const d=await api(`/tenants/${tenant}/rollback`,{method:'POST',body:JSON.stringify({deployment_id:id,confirm_tenant:tenant})});log(`Revertido: ${d.removed.length} eliminados, ${d.errors.length} errores. Backup previo ${d.backup_id}.`)}catch(e){log('Error: '+e.message)}}
init();
</script>
</body>
</html>
