name: Despliegue a Azure App Service

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # login a Azure por OIDC, sin secretos de larga duración

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.AZURE_WEBAPP_NAME != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Empaquetar app (requirements en la raíz para que App Service la construya)
        run: |
          mkdir -p dist
          cp -r backend/app dist/app
          cp -r baselines dist/baselines
          cp backend/requirements.txt dist/requirements.txt

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: dist
